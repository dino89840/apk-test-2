plugins {
    id 'com.android.application'
}

def envOrProperty = { String name ->
    def value = System.getenv(name)

    if (
            value == null ||
            value.toString().trim().isEmpty()
    ) {
        value = project.findProperty(name)
    }

    return value == null
            ? ""
            : value.toString()
}

def cmflixAppKey =
        envOrProperty("CMFLIX_APP_KEY")

def releaseStorePath =
        envOrProperty("ANDROID_KEYSTORE_PATH")

def releaseStorePassword =
        envOrProperty("ANDROID_KEYSTORE_PASSWORD")

def releaseKeyAlias =
        envOrProperty("ANDROID_KEY_ALIAS")

def releaseKeyPassword =
        envOrProperty("ANDROID_KEY_PASSWORD")

android {
    namespace 'com.cmflix.nativeapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.cmflix.nativeapp"

        minSdk 23
        targetSdk 35

        versionCode 3
        versionName "1.2"

        buildConfigField(
                "String",
                "CMFLIX_APP_KEY",
                "\"${cmflixAppKey
                        .replace("\\", "\\\\")
                        .replace("\"", "\\\"")}\""
        )

        buildConfigField(
                "String",
                "API_BASE_URL",
                "\"https://kkflix.xubi.org/api/\""
        )
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            /*
             * Keystore/password တွေကို source code ထဲ
             * တိုက်ရိုက်မထည့်ဘဲ environment variables
             * သို့မဟုတ် Gradle properties ကနေဖတ်မယ်။
             */
            storeFile rootProject.file(
                    releaseStorePath.isEmpty()
                            ? "__missing_release_keystore__.jks"
                            : releaseStorePath
            )

            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            /*
             * Debuggable မဟုတ်သော production build။
             */
            debuggable false

            /*
             * R8 code shrinking, optimization နဲ့
             * obfuscation ကိုဖွင့်ထားသည်။
             */
            minifyEnabled true

            /*
             * အသုံးမပြုသည့် resources များကိုဖယ်ရှားမည်။
             */
            shrinkResources true

            /*
             * Release keystore ဖြင့် sign လုပ်မည်။
             */
            signingConfig signingConfigs.release

            proguardFiles(
                    getDefaultProguardFile(
                            'proguard-android-optimize.txt'
                    ),
                    'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.core:core-splashscreen:1.0.0'

    def media3Version = "1.11.0"

    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"

    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
