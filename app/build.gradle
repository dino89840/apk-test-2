import java.security.MessageDigest
import java.util.Arrays
import javax.crypto.Cipher
import javax.crypto.spec.IvParameterSpec
import javax.crypto.spec.SecretKeySpec

plugins {
    id 'com.android.application'
}

def envOrProperty = { String name ->
    def value = System.getenv(name)

    if (
            value == null ||
            value.toString().trim().isEmpty()
    ) {
        value = project.findProperty(name)
    }

    return value == null
            ? ""
            : value.toString()
}

def cmflixAppKey =
        envOrProperty("CMFLIX_APP_KEY")

/*
 * Build-time string encryption (runtime counterpart: CryptoUtil.java).
 *
 * The plaintext app key comes only from CI secrets / env and is encrypted
 * here with AES-128-CBC. Only the base64 ciphertext is baked into
 * BuildConfig, so the APK never contains the key in readable form.
 *
 * Key parts are assembled in scrambled order and hashed -- the assembly
 * order, salts and algorithm must match the native decryptor in
 * app/src/main/cpp/secrets.cpp (CryptoUtil delegates to it via JNI).
 */
def cmflixPart0 = "zoTOB7AidP"
def cmflixPart1 = "qxM31r3CDt"
def cmflixPart2 = "NEuiMngXfX"
def cmflixPart3 = "fZUl8eyyDD"
def cmflixAssembled = cmflixPart2 + cmflixPart0 + cmflixPart3 + cmflixPart1

def cmflixDerivedBytes = { String salt ->
    byte[] hash = MessageDigest.getInstance("SHA-256")
            .digest((cmflixAssembled + salt).getBytes("UTF-8"))
    Arrays.copyOfRange(hash, 0, 16)
}

def cmflixAesKey =
        new SecretKeySpec(cmflixDerivedBytes("|k1"), "AES")
def cmflixAesIv =
        new IvParameterSpec(cmflixDerivedBytes("|i1"))

def cmflixEncrypt = { String plain ->
    Cipher cipher = Cipher.getInstance("AES/CBC/PKCS5Padding")
    cipher.init(Cipher.ENCRYPT_MODE, cmflixAesKey, cmflixAesIv)
    java.util.Base64.getEncoder()
            .encodeToString(cipher.doFinal(plain.getBytes("UTF-8")))
}

def cmflixDecrypt = { String base64Ciphertext ->
    Cipher cipher = Cipher.getInstance("AES/CBC/PKCS5Padding")
    cipher.init(Cipher.DECRYPT_MODE, cmflixAesKey, cmflixAesIv)
    new String(
            cipher.doFinal(
                    java.util.Base64.getDecoder().decode(base64Ciphertext)),
            "UTF-8")
}

// Self-test: fails the build loudly if encrypt/decrypt ever disagree,
// so a broken encryptor can never ship a bad ciphertext into the APK.
def cmflixSelfTestVector = "cmflix-selftest-vector"
assert cmflixDecrypt(cmflixEncrypt(cmflixSelfTestVector)) ==
        cmflixSelfTestVector : "cmflix build-time crypto self-test failed"

// Cross-implementation pin: AES-CBC with a fixed IV is deterministic, so
// encrypting a known value must reproduce the known-good ciphertext.
// This catches any drift between this Groovy encryptor and the native
// decryptor (verified: the same vector decrypts correctly in secrets.cpp).
assert cmflixEncrypt("iqowoq") ==
        "eYfWVCItMPTfAWhBVxWccg==" : "cmflix crypto vector mismatch"

def releaseStorePath =
        envOrProperty("ANDROID_KEYSTORE_PATH")

def releaseStorePassword =
        envOrProperty("ANDROID_KEYSTORE_PASSWORD")

def releaseKeyAlias =
        envOrProperty("ANDROID_KEY_ALIAS")

def releaseKeyPassword =
        envOrProperty("ANDROID_KEY_PASSWORD")

android {
    namespace 'com.cmflix.nativeapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.cmflix.nativeapp"

        minSdk 23
        targetSdk 35

        versionCode 3
        versionName "1.2"

        // NOTE: the value below is the AES-encrypted app key (base64).
        // The plaintext comes only from CI secrets; see cmflixEncrypt above
        // and CryptoUtil.dec() at runtime. Never put plaintext here.
        buildConfigField(
                "String",
                "CMFLIX_APP_KEY",
                "\"${cmflixEncrypt(cmflixAppKey)}\""
        )

        // Native secret store (libcmflix_secrets.so): key material and the
        // AES/SHA-256 implementation live in C++ (app/src/main/cpp), not in
        // the dex file. ndk-build is used; the NDK itself is bootstrapped
        // in settings.gradle (CI runners do not preinstall it).
        ndkVersion "27.2.12479018"
        externalNativeBuild {
            // Per-variant ndk-build flags go here (arguments/cFlags/targets).
            // NOTE: no path() on this block (AGP type has no such method).
            ndkBuild {
            }
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    externalNativeBuild {
        ndkBuild {
            // REQUIRED: AGP only runs ndk-build when this path is set
            // (empty block = silently skipped, no .so in the APK).
            path "src/main/jni/Android.mk"
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            /*
             * Keystore/password တွေကို source code ထဲ
             * တိုက်ရိုက်မထည့်ဘဲ environment variables
             * သို့မဟုတ် Gradle properties ကနေဖတ်မယ်။
             */
            storeFile rootProject.file(
                    releaseStorePath.isEmpty()
                            ? "__missing_release_keystore__.jks"
                            : releaseStorePath
            )

            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            /*
             * Debuggable မဟုတ်သော production build။
             */
            debuggable false

            /*
             * R8 code shrinking, optimization နဲ့
             * obfuscation ကိုဖွင့်ထားသည်။
             */
            minifyEnabled true

            /*
             * အသုံးမပြုသည့် resources များကိုဖယ်ရှားမည်။
             */
            shrinkResources true

            /*
             * Release keystore ဖြင့် sign လုပ်မည်။
             */
            signingConfig signingConfigs.release

            proguardFiles(
                    getDefaultProguardFile(
                            'proguard-android-optimize.txt'
                    ),
                    'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.0.0'

    def media3Version = "1.11.0"

    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
}
