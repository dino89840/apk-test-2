name: Build CMFLIX Release APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: >-
            ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > app/release.jks

      - name: Build signed release APK
        env:
          CMFLIX_APP_KEY: >-
            ${{ secrets.CMFLIX_APP_KEY }}

          ANDROID_KEYSTORE_PATH: >-
            app/release.jks

          ANDROID_KEYSTORE_PASSWORD: >-
            ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

          ANDROID_KEY_ALIAS: >-
            ${{ secrets.ANDROID_KEY_ALIAS }}

          ANDROID_KEY_PASSWORD: >-
            ${{ secrets.ANDROID_KEY_PASSWORD }}

        run: |
          gradle clean assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify release APK
        run: |
          test -f \
            app/build/outputs/apk/release/app-release.apk

          ls -lh \
            app/build/outputs/apk/release/

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: CMFLIX-Release-APK
          path: >-
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: |
          rm -f app/release.jks
